<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial;
            background: linear-gradient(135deg,#667eea,#764ba2);
            margin: 0;
            padding: 40px;
        }
        .card {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px #2228;
        }
        .profile {
            text-align: center;
        }
        .profile img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 5px solid #667eea;
        }
        h1 { margin: 10px 0 5px; }
        .role { color: #667eea; font-weight: bold; }
        .skills { margin-top: 25px; }
        .skill { margin: 15px 0; }
        progress { width: 100%; height: 18px; }
        .contact {
            margin-top: 25px;
            padding: 15px;
            background: #f1f3f8;
            border-radius: 10px;
        }
        a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="profile">
        <img src="https://via.placeholder.com/110" alt="Student Photo">
        <h1>Dnyaneshwari Karale</h1>
        <p class="role">Computer Engineering Student</p>
        <p>Passionate about Web Development, AI and Cloud Computing.</p>
    </div>

    <div class="skills">
        <h2>My Skills</h2>

        <div class="skill">
            <label>HTML & CSS</label>
            <progress value="90" max="100"></progress>
        </div>

        <div class="skill">
            <label>Python</label>
            <progress value="80" max="100"></progress>
        </div>

        <div class="skill">
            <label>JavaScript</label>
            <progress value="70" max="100"></progress>
        </div>

        <div class="skill">
            <label>Cloud Computing</label>
            <progress value="65" max="100"></progress>
        </div>
    </div>

    <div class="contact">
        <h2>Contact Me</h2>
        <p>📧 Email: student@example.com</p>
        <p>💻 GitHub: <a href="#">github.com/student</a></p>
        <p>🔗 LinkedIn: <a href="#">linkedin.com/student</a></p>
    </div>

    <footer>
        © 2026 My Student Profile
    </footer>

</div>

</body>
</html>
